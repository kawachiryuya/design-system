name: Chromatic

# 視覚回帰 (Chromatic) — 既存 CI (ci.yml の verify) に対し additive。
#
# push ベースで実行する (Chromatic 公式推奨)。pull_request イベントは GitHub が作る
# ephemeral な merge commit 上で走り、baseline の系譜を見失う (PR で before が空になる)
# ため使わない。PR には push でビルドした head SHA に対し Chromatic GitHub App が
# "UI Tests" status を出すので、required check は従来どおり機能する。
#
# 差分の合否は Chromatic UI で人間がレビュー & accept する (exitZeroOnChanges: true)。
# main は baseline ブランチとして自動 accept する (autoAcceptChanges) — squash マージで
# 系譜が切れても main の baseline が確定し、以降の PR が正しく比較できる。

on:
  push:
    branches:
      - '**' # 全ブランチ (tag は対象外 = release.yml と分離)

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # TurboSnap / baseline 検出に全履歴が必要

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kawachiryuya'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook # prebuild-storybook フックで tokens:build も走る
          onlyChanged: true # TurboSnap: 変更 story (と依存先) だけ再撮影
          # TurboSnap は Vite の module graph (import 連鎖) で「変更が届く story」を探す。
          # Tailwind / PostCSS 経由で CSS になるファイル (preset・token source・global CSS) は
          # どの story からも import されておらず graph の外にいるため、変えても
          # 「0 story 影響 → 撮影 skip」になる (#107 で枠線色が変わっても 67 snapshot が
          # bypass され、main の baseline も更新されなかった)。これらを externals に列挙し、
          # 1 つでも変わったら TurboSnap を無効化して全 story を撮り直す。
          # (.storybook/ と package.json / lockfile は CLI が既定で全撮影扱い)
          externals: |
            tokens/**
            styles/**
            tailwind.config.cjs
            postcss.config.js
            .github/workflows/chromatic.yml
          exitZeroOnChanges: true # 視覚差分で Actions job を赤にしない (差分は Chromatic UI でレビュー)
          autoAcceptChanges: 'main' # main は baseline ブランチとして自動 accept (squash マージでの baseline 消失を防ぐ)
