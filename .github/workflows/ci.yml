name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kawachiryuya'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tokens
        run: npm run tokens:build

      - name: Check contrast (WCAG 2 AA / §8-5)
        run: npm run check:contrast

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Check conventions (§5 規約適合)
        run: npm run check:conventions

      - name: Check Storybook links (§9-3)
        run: npm run check:links

      - name: Build Storybook
        run: npm run build-storybook

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run Storybook tests (smoke + play + axe)
        run: |
          npx http-server storybook-static --port 6006 --silent &
          npx wait-on tcp:127.0.0.1:6006 -t 60000
          npx test-storybook --url http://127.0.0.1:6006 --maxWorkers=2
