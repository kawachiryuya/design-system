name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # ubuntu-latest が 26.04 に上がり、Playwright 1.60 の `install --with-deps chromium` が
    # 「ubuntu26.04 は未対応」で落ちるため 24.04 に固定する。Playwright (= @storybook/test-runner) を
    # 26.04 対応版へ上げたら ubuntu-latest に戻してよい。
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kawachiryuya'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 検査の一覧は package.json の `verify` が唯一の正本 (#125 G-2)。ここに検査を個別に並べない。
      # 以前は CI が検査を 1 つずつ並べていて、verify に足した検査 (check:utilities / check:preset-deps /
      # check:theme-contract) が CI に入らないままになっていた。検査を足すときは verify に足す。
      # どの検査で落ちたかは、このステップのログの `✗ check:...` の行に出る。
      - name: Verify (tokens:build + 全 check + lint + typecheck)
        run: npm run verify

      - name: Build library (tsc + dist styles.css / A2 #57)
        run: npm run build

      # mode①(no-Tailwind) ガード (#95): build 済み dist に対し、Tailwind ゼロのサンプルが
      # 公開エントリ + 2 CSS だけで build できることを検証 (exports / styles.css の silent break 検出)。
      - name: Install no-Tailwind example deps
        run: npm install --prefix examples/no-tailwind
      - name: Build no-Tailwind example (mode① guard)
        run: npm run build --prefix examples/no-tailwind

      - name: Build Storybook
        run: npm run build-storybook

      # 非ゲート: 適合率レポート (AGENTS §9-5)。常に exit 0、CI を落とさない。
      - name: Report conformance (non-gating)
        run: npm run report:conformance

      - name: Upload conformance report
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance/report.json

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run Storybook tests (smoke + play + axe)
        run: |
          npx http-server storybook-static --port 6006 --silent &
          npx wait-on tcp:127.0.0.1:6006 -t 60000
          npx test-storybook --url http://127.0.0.1:6006 --maxWorkers=2
